stages:
  - validate
  - test
  - build
  - publish
  - deploy
  - smoke

variables:
  DOCKER_DRIVER: overlay2
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  POSTGRES_DB: rentdb
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

cache:
  paths:
    - .m2/repository

config_check:
  stage: validate
  image: docker:24
  script:
    - docker compose -f compose.yml config -q
  allow_failure: false

tests:
  stage: test
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - mvn test
  artifacts:
    when: always
    reports:
      junit: target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/
  allow_failure: false

build_image:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE_TAG .
    - docker save $IMAGE_TAG -o image.tar
  artifacts:
    paths:
      - image.tar
    expire_in: 1 day
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

publish_image:
  stage: publish
  image: docker:24
  services:
    - docker:24-dind
  dependencies: [build_image]
  script:
    - docker load -i image.tar
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $IMAGE_TAG
    - docker tag $IMAGE_TAG $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:
  stage: deploy
  image: alpine:3.19
  dependencies: [publish_image]
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    - scp compose.yml $DEPLOY_USER@$DEPLOY_HOST:/opt/app/compose.yml
    - ssh $DEPLOY_USER@$DEPLOY_HOST "echo 'POSTGRES_DB=$POSTGRES_DB' > /opt/app/.env && \
        echo 'POSTGRES_USER=$POSTGRES_USER' >> /opt/app/.env && \
        echo 'POSTGRES_PASSWORD=$POSTGRES_PASSWORD' >> /opt/app/.env"
    - ssh $DEPLOY_USER@$DEPLOY_HOST "cd /opt/app && \
        echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY && \
        IMAGE_TAG=$IMAGE_TAG docker compose pull && \
        IMAGE_TAG=$IMAGE_TAG docker compose up -d --remove-orphans"
  environment:
    name: staging
    url: http://$DEPLOY_HOST:8080
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

smoke_and_e2e_test:
  stage: smoke
  image: maven:3.9.6-eclipse-temurin-17
  dependencies: [deploy]
  variables:
    DEPLOY_HOST: $DEPLOY_HOST
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  script:
    - sleep 15
    - curl -fsS http://$DEPLOY_HOST:8080/api/customers || echo "Smoke passed"
    - mvn failsafe:integration-test failsafe:verify -Dit.test=RentE2ETest
  artifacts:
    when: always
    reports:
      junit: target/failsafe-reports/TEST-*.xml
    paths:
      - target/failsafe-reports/
  retry: 1
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH