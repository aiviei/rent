name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Run unit and integration tests
      run: mvn test
    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: target/surefire-reports/

  build-and-e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build Docker image
      run: docker build -t rent-app:latest .
    - name: Run Docker Compose (Deploy)
      run: |
        echo "POSTGRES_DB=rentdb" > .env
        echo "POSTGRES_USER=postgres" >> .env
        echo "POSTGRES_PASSWORD=postgres" >> .env
        docker compose up -d
        sleep 15 # Ждем, пока Spring Boot полностью запустится
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Run E2E Tests
      env:
        DEPLOY_HOST: localhost
      run: mvn verify -Dit.test=RentE2ETest -DskipUnitTests=true
    - name: Upload E2E Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-reports
        path: target/failsafe-reports/